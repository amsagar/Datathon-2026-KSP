user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Temp paths under /tmp so nginx runs as a non-root UID (pod runAsUser: 1000).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache content-hashed static assets
        location ~* \.(?:ico|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|css|js|map)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Proxy API + SSE to the backend gateway. PROXY_PASS_URL and
        # RESOLVER_PLACEHOLDER are replaced at container start by docker-defaults.sh
        # ($BASE_URL and the cluster DNS from /etc/resolv.conf). The resolver +
        # variable proxy_pass defer DNS to request time, so a gateway that isn't
        # resolvable at boot can't crash nginx. No path on $upstream, and the full
        # original URI is re-appended, so the /api prefix is preserved.
        location /api/ {
            resolver RESOLVER_PLACEHOLDER valid=30s;
            resolver_timeout 5s;
            set $upstream PROXY_PASS_URL;
            proxy_pass $upstream$request_uri;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Accel-Buffering no;

            # SSE streaming (/api/chat/stream): keep the upstream stream flowing
            # by disabling response buffering and request-level keep-alive reuse.
            # 5-hour idle budget so long-running streamed turns don't get cut.
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 18000s;
            proxy_send_timeout 18000s;
        }
    }
}
