spring:
  application:
    name: ksp-agent
  mvc:
    async:
      # 5 hours — chat SSE turns (tools + LLM) can run a long time
      request-timeout: 18000000
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sql-models/chat-session-model.sql
        - classpath:sql-models/assistant-model.sql
        - classpath:sql-models/agent-tool-model.sql
        - classpath:sql-models/agent-tool-group-model.sql
        - classpath:sql-models/agent-skill-model.sql
        - classpath:sql-models/agent-document-model.sql
        - classpath:sql-models/chat-tool-event-model.sql
        - classpath:sql-models/response-style-model.sql
        - classpath:sql-models/mcp-server-model.sql
        - classpath:sql-models/chat-session-summary-model.sql
        - classpath:sql-models/llm-usage-model.sql
        - classpath:sql-models/chat-share-model.sql
        - classpath:sql-models/semantic-memory-model.sql
        - classpath:sql-models/app-user-model.sql
        - classpath:sql-models/user-audit-model.sql
        - classpath:sql-models/crime-assistant-seed.sql
        - classpath:sql-models/prompt-suggestion-model.sql
        - classpath:sql-models/config-audit-model.sql
        - classpath:sql-models/alert-model.sql
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
logging:
  level:
    com.ksp.agent.chat.audit: INFO
    com.ksp.agent.chat.controller.ChatController: INFO

agent:
  scope-guard:
    enabled: true
  clarification:
    timeout-minutes: 5
  memory:
    recent-window: 20
    summary-threshold: 40
    char-budget: 24000
    tools:
      enabled: true
  http-tool:
    connect-timeout-ms: 10000
    read-timeout-ms: 30000
    max-attempts: 2
    retry-backoff-ms: 1000
  quickml:
    connect-timeout-ms: 10000
    read-timeout-ms: 120000
    streaming: false
  # EN↔KN via therealbush/translator (https://github.com/therealbush/translator).
  tts:
    voice-en: ${TTS_VOICE_EN:en-IN-NeerjaNeural}
    voice-kn: ${TTS_VOICE_KN:kn-IN-SapnaNeural}
  # In-process ping while an instance is already up (secondary). AppSail still
  # scales instances down after ~5 min — use .github/workflows/appsail-keepalive.yml
  # (external cron) as the real anti-idle fix.
  keepalive:
    enabled: ${AGENT_KEEPALIVE_ENABLED:true}
    url: ${AGENT_KEEPALIVE_URL:https://ksp-agent-service-50044089204.development.catalystappsail.in/}
    interval-ms: ${AGENT_KEEPALIVE_INTERVAL_MS:120000}
    initial-delay-ms: ${AGENT_KEEPALIVE_INITIAL_DELAY_MS:15000}
  storage:
    root: ${AGENT_STORAGE_ROOT:./data/blobs}
  auth:
    jwt-expiration-ms: 28800000
    jwt-issuer: ksp-agent
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://localhost:4000"
      - "http://127.0.0.1:4000"
      - "http://localhost:5173"
      - "http://localhost:5174"

ksp:
  usage:
    pricing:
      default-rates:
        input-per-million: 2.50
        output-per-million: 10.00
      models: {}