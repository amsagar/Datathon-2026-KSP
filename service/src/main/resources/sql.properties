# --- Long-term semantic memory ---
# Resolve the owner/assistant of a session without the per-user filter (used by the async
# consolidation path, which runs off the request thread and has no SecurityContext).
CHAT.SESSION.FIND_OWNER=SELECT user_id, assistant_id, temporary FROM chat_session WHERE id = ?::uuid
FACT.INSERT=INSERT INTO semantic_fact (user_id, assistant_id, session_id, subject, predicate, object, confidence, importance, created_at, last_accessed_at) VALUES (?, ?::uuid, ?::uuid, ?, ?, ?, ?, ?, ?, ?)
FACT.SUPERSEDE=UPDATE semantic_fact SET superseded = TRUE WHERE superseded = FALSE AND user_id = ? AND assistant_id = ?::uuid AND lower(subject) = lower(?) AND lower(predicate) = lower(?)
FACT.RECALL=SELECT id, subject, predicate, object, confidence, importance, 1 - (embedding <=> ?::vector) AS score FROM semantic_fact WHERE superseded = FALSE AND embedding IS NOT NULL AND (user_id = ? OR user_id IS NULL) AND (assistant_id = ?::uuid OR assistant_id IS NULL) AND confidence >= ? ORDER BY score DESC LIMIT ?
FACT.REINFORCE=UPDATE semantic_fact SET importance = LEAST(1.0, importance + ?), last_accessed_at = ? WHERE id = ANY (?::uuid[])
FACT.FIND_EMBEDDING_HASH=SELECT embedding_hash FROM semantic_fact WHERE id = ?::uuid
FACT.UPDATE_EMBEDDING=UPDATE semantic_fact SET embedding = ?::vector, embedding_hash = ? WHERE id = ?::uuid
FACT.FIND_TEXT_BY_ID=SELECT subject, predicate, object FROM semantic_fact WHERE id = ?::uuid
FACT.FIND_MISSING_EMBEDDING=SELECT id, subject, predicate, object FROM semantic_fact WHERE embedding IS NULL AND superseded = FALSE
FACT.DECAY=UPDATE semantic_fact SET importance = importance * exp(? * ((? - last_accessed_at) / 86400.0)) WHERE superseded = FALSE
FACT.PRUNE=DELETE FROM semantic_fact WHERE importance < ? OR superseded = TRUE
FACT.LIST_BY_USER=SELECT id, assistant_id, session_id, subject, predicate, object, confidence, importance, superseded, created_at, last_accessed_at FROM semantic_fact WHERE user_id = ? AND superseded = FALSE ORDER BY last_accessed_at DESC
FACT.DELETE_BY_ID_FOR_USER=DELETE FROM semantic_fact WHERE id = ?::uuid AND user_id = ?
FACT.DELETE_ALL_BY_USER=DELETE FROM semantic_fact WHERE user_id = ?

