USER.FIND_BY_ID=SELECT id, username, password_hash, display_name, email, roles, date_of_birth, phone, designation, department, photo_content_type, enabled, must_change_password, last_login_at, created_at, updated_at FROM app_user WHERE id = ?::uuid
USER.FIND_BY_USERNAME=SELECT id, username, password_hash, display_name, email, roles, date_of_birth, phone, designation, department, photo_content_type, enabled, must_change_password, last_login_at, created_at, updated_at FROM app_user WHERE username = ?
USER.UPDATE_PROFILE_AND_ROLES=UPDATE app_user SET display_name = ?, email = ?, roles = ?, date_of_birth = ?, phone = ?, designation = ?, department = ?, enabled = ?, updated_at = ? WHERE id = ?::uuid
USER.UPDATE_PASSWORD=UPDATE app_user SET password_hash = ?, must_change_password = ?, updated_at = ? WHERE id = ?::uuid
USER.SET_ENABLED=UPDATE app_user SET enabled = ?, updated_at = ? WHERE id = ?::uuid
USER.UPDATE_PHOTO=UPDATE app_user SET photo = ?, photo_content_type = ?, updated_at = ? WHERE id = ?::uuid
USER.FIND_PHOTO=SELECT photo, photo_content_type FROM app_user WHERE id = ?::uuid
