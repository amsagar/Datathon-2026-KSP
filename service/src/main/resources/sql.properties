AUDIT_ACCESS_SETTINGS.UPDATE=UPDATE audit_access_settings SET non_admin_read_enabled = ?, updated_by = ?, updated_at = ? WHERE id = 1

# --- Prompt suggestions (empty-screen starter prompts) ---
SUGGESTION.INSERT=INSERT INTO prompt_suggestion (assistant_id, user_id, text, lang, source, enabled, created_at, updated_at) VALUES (?::uuid, ?, ?, ?, ?, TRUE, ?, ?)
SUGGESTION.FIND_ASSISTANT_LEVEL=SELECT text FROM prompt_suggestion WHERE assistant_id = ?::uuid AND user_id IS NULL AND lang = ? AND enabled = TRUE ORDER BY created_at DESC
SUGGESTION.FIND_FOR_USER=SELECT text FROM prompt_suggestion WHERE assistant_id = ?::uuid AND user_id = ? AND lang = ? AND enabled = TRUE ORDER BY created_at DESC
SUGGESTION.COUNT_GENERATED=SELECT COUNT(*) FROM prompt_suggestion WHERE assistant_id = ?::uuid AND user_id IS NULL AND lang = ? AND source = 'assistant'
SUGGESTION.DELETE_ASSISTANT_GENERATED=DELETE FROM prompt_suggestion WHERE assistant_id = ?::uuid AND user_id IS NULL AND lang = ? AND source = 'assistant'
SUGGESTION.DELETE_USER_GENERATED=DELETE FROM prompt_suggestion WHERE assistant_id = ?::uuid AND user_id = ? AND lang = ? AND source = 'user'
