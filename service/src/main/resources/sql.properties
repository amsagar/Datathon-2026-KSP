MCP.TOOL.UPSERT=INSERT INTO mcp_server_tool (server_id, name, description, input_schema, enabled, created_at, updated_at) VALUES (?::uuid, ?, ?, ?, TRUE, ?, ?) ON CONFLICT (server_id, name) DO UPDATE SET description = EXCLUDED.description, input_schema = EXCLUDED.input_schema, updated_at = EXCLUDED.updated_at
MCP.TOOL.FIND_BY_ID=SELECT * FROM mcp_server_tool WHERE id = ?::uuid
