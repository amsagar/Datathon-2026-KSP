# --- User audit log ---
AUDIT.CREATE=INSERT INTO user_audit_log (actor, action, target, details, created_at) VALUES (?, ?, ?, ?, ?)
AUDIT.FIND_RECENT=SELECT id, actor, action, target, details, created_at FROM user_audit_log WHERE (?::varchar IS NULL OR lower(actor) LIKE ? OR lower(target) LIKE ? OR lower(details) LIKE ?) AND (?::varchar IS NULL OR action = ?) ORDER BY created_at DESC LIMIT ? OFFSET ?
AUDIT.COUNT=SELECT COUNT(*) FROM user_audit_log WHERE (?::varchar IS NULL OR lower(actor) LIKE ? OR lower(target) LIKE ? OR lower(details) LIKE ?) AND (?::varchar IS NULL OR action = ?)

# --- Config audit feed + revision history/revert (assistants, skills, tools, templates, etc.) ---
CONFIG_AUDIT_EVENT.INSERT=INSERT INTO config_audit_event (resource_type, resource_id, assistant_id, resource_name, action, actor, summary, created_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?)
CONFIG_AUDIT_EVENT.FIND_FEED=SELECT id, resource_type, resource_id, assistant_id, resource_name, action, actor, summary, created_at FROM config_audit_event WHERE (?::varchar IS NULL OR resource_type = ?) AND (?::varchar IS NULL OR actor = ?) AND (?::varchar IS NULL OR resource_id = ?) AND (?::bigint IS NULL OR created_at >= ?) AND (?::bigint IS NULL OR created_at <= ?) ORDER BY created_at DESC LIMIT ? OFFSET ?
CONFIG_AUDIT_EVENT.COUNT_FEED=SELECT COUNT(*) FROM config_audit_event WHERE (?::varchar IS NULL OR resource_type = ?) AND (?::varchar IS NULL OR actor = ?) AND (?::varchar IS NULL OR resource_id = ?) AND (?::bigint IS NULL OR created_at >= ?) AND (?::bigint IS NULL OR created_at <= ?)

CONFIG_REVISION.INSERT=INSERT INTO config_revision (resource_type, resource_id, assistant_id, version, action, actor, snapshot, content_ref, summary, created_at) VALUES (?, ?, ?, ?, ?, ?, ?::jsonb, ?, ?, ?)
CONFIG_REVISION.FIND_MAX_VERSION=SELECT COALESCE(MAX(version), 0) FROM config_revision WHERE resource_type = ? AND resource_id = ?
CONFIG_REVISION.FIND_SUMMARIES=SELECT id, version, action, actor, summary, content_ref, created_at FROM config_revision WHERE resource_type = ? AND resource_id = ? ORDER BY version DESC
CONFIG_REVISION.FIND_ONE=SELECT id, resource_type, resource_id, assistant_id, version, action, actor, snapshot, content_ref, summary, created_at FROM config_revision WHERE resource_type = ? AND resource_id = ? AND version = ?
CONFIG_REVISION.COUNT=SELECT COUNT(*) FROM config_revision WHERE resource_type = ? AND resource_id = ?

