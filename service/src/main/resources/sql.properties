USAGE.EVENT.CREATE=INSERT INTO llm_usage_event (request_id, session_id, user_id, assistant_id, usage_kind, usage_source, model_name, prompt_tokens, completion_tokens, total_tokens, created_at) VALUES (?, ?::uuid, ?, ?::uuid, ?, ?, ?, ?, ?, ?, ?)
USAGE.SUMMARY=SELECT COUNT(*) AS request_count, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens, COALESCE(SUM(total_tokens), 0) AS total_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? AND (?::varchar IS NULL OR user_id = ?::varchar)
USAGE.DAILY=SELECT (created_at AT TIME ZONE 'UTC')::date AS day, COUNT(*) AS request_count, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens, COALESCE(SUM(total_tokens), 0) AS total_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? AND (?::varchar IS NULL OR user_id = ?::varchar) GROUP BY day ORDER BY day ASC
USAGE.BY_MODEL=SELECT CASE WHEN usage_kind = 'system' THEN 'System' ELSE model_name END AS model_name, COUNT(*) AS request_count, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens, COALESCE(SUM(total_tokens), 0) AS total_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? AND (?::varchar IS NULL OR user_id = ?::varchar) GROUP BY CASE WHEN usage_kind = 'system' THEN 'System' ELSE model_name END ORDER BY total_tokens DESC
USAGE.BY_USER=SELECT user_id, COUNT(*) AS request_count, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens, COALESCE(SUM(total_tokens), 0) AS total_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? GROUP BY user_id ORDER BY total_tokens DESC
# --- Model-split queries: paired with a display-bucket query above so cost (priced per real
# model) can be attached to a bucket that may span several models. bucket_key/model_name are the
# generic column aliases UsageMetrics.ModelSplitRow expects.
USAGE.DAILY_BY_MODEL=SELECT (created_at AT TIME ZONE 'UTC')::date::varchar AS bucket_key, model_name AS model_name, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? AND (?::varchar IS NULL OR user_id = ?::varchar) GROUP BY (created_at AT TIME ZONE 'UTC')::date, model_name
USAGE.BY_MODEL_FOR_COST=SELECT model_name, usage_kind, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? AND (?::varchar IS NULL OR user_id = ?::varchar) GROUP BY model_name, usage_kind
USAGE.BY_USER_BY_MODEL=SELECT user_id AS bucket_key, model_name AS model_name, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? GROUP BY user_id, model_name
USAGE.BY_ASSISTANT=SELECT COALESCE(a.name, 'Unscoped') AS key, COUNT(*) AS request_count, COALESCE(SUM(e.prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(e.completion_tokens), 0) AS completion_tokens, COALESCE(SUM(e.total_tokens), 0) AS total_tokens FROM llm_usage_event e LEFT JOIN assistant a ON a.id = e.assistant_id WHERE e.created_at >= ? AND e.created_at < ? AND (?::varchar IS NULL OR e.user_id = ?::varchar) GROUP BY COALESCE(a.name, 'Unscoped') ORDER BY total_tokens DESC
USAGE.BY_ASSISTANT_BY_MODEL=SELECT COALESCE(a.name, 'Unscoped') AS bucket_key, e.model_name AS model_name, COALESCE(SUM(e.prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(e.completion_tokens), 0) AS completion_tokens FROM llm_usage_event e LEFT JOIN assistant a ON a.id = e.assistant_id WHERE e.created_at >= ? AND e.created_at < ? AND (?::varchar IS NULL OR e.user_id = ?::varchar) GROUP BY COALESCE(a.name, 'Unscoped'), e.model_name
USAGE.BY_SOURCE=SELECT usage_source AS key, COUNT(*) AS request_count, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens, COALESCE(SUM(total_tokens), 0) AS total_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? AND (?::varchar IS NULL OR user_id = ?::varchar) GROUP BY usage_source ORDER BY total_tokens DESC
USAGE.BY_SOURCE_BY_MODEL=SELECT usage_source AS bucket_key, model_name AS model_name, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? AND (?::varchar IS NULL OR user_id = ?::varchar) GROUP BY usage_source, model_name
USAGE.HOURLY=SELECT EXTRACT(HOUR FROM created_at AT TIME ZONE 'UTC')::int AS hour, COUNT(*) AS request_count, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens, COALESCE(SUM(total_tokens), 0) AS total_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? AND (?::varchar IS NULL OR user_id = ?::varchar) GROUP BY EXTRACT(HOUR FROM created_at AT TIME ZONE 'UTC') ORDER BY hour ASC
USAGE.HOURLY_BY_MODEL=SELECT EXTRACT(HOUR FROM created_at AT TIME ZONE 'UTC')::int::varchar AS bucket_key, model_name AS model_name, COALESCE(SUM(prompt_tokens), 0) AS prompt_tokens, COALESCE(SUM(completion_tokens), 0) AS completion_tokens FROM llm_usage_event WHERE created_at >= ? AND created_at < ? AND (?::varchar IS NULL OR user_id = ?::varchar) GROUP BY EXTRACT(HOUR FROM created_at AT TIME ZONE 'UTC'), model_name

# --- Spring AI chat-memory transcript (SPRING_AI_CHAT_MEMORY, schema owned by Spring AI) ---
# Append-only insert matching Spring AI's own saveAll wire format (content = message text,
# type = MessageType name, "timestamp" = epoch-second sequence * 1000 ms).
CHAT.MEMORY.APPEND=INSERT INTO SPRING_AI_CHAT_MEMORY (conversation_id, content, type, "timestamp") VALUES (?, ?, ?, ?)
CHAT.MEMORY.COUNT=SELECT COUNT(*) FROM SPRING_AI_CHAT_MEMORY WHERE conversation_id = ?
CHAT.MEMORY.COUNT_BY_TYPE=SELECT COUNT(*) FROM SPRING_AI_CHAT_MEMORY WHERE conversation_id = ? AND type = ?
CHAT.MEMORY.FIND_LAST=SELECT content, type FROM SPRING_AI_CHAT_MEMORY WHERE conversation_id = ? ORDER BY "timestamp" DESC LIMIT 1

