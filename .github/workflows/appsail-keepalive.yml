# AppSail scales instances down after ~5 minutes of uptime. An in-process ping
# dies with the container — wake the backend (and optional UI) from outside.
#
# Optional repo variables (Settings → Variables → Actions):
#   APPSAIL_BE_URL  - e.g. https://ksp-agent-service-….catalystappsail.in
#   APPSAIL_UI_URL  - e.g. https://ksp-….catalystappsail.in  (optional)
#
# Defaults match the current Development backend if the variable is unset.

name: AppSail keep-alive

on:
  schedule:
    # Every 4 minutes — instance TTL is ~5 min; keep a warm spawn cycle.
    - cron: "*/4 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health
        env:
          BE_URL: ${{ vars.APPSAIL_BE_URL }}
        run: |
          set -euo pipefail
          BE="https://ksp-agent-service-50044089204.catalystappsail.in"
          BE="${BE%/}"
          for path in / /health /api/health; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 90 -A "ksp-appsail-keepalive/1.0" "${BE}${path}" || echo "000")
            echo "GET ${BE}${path} → HTTP ${code}"
            if [ "$code" = "200" ]; then
              head -c 200 /tmp/body; echo
              exit 0
            fi
          done
          echo "All backend health paths failed"
          exit 1

      - name: Ping UI / (optional)
        if: ${{ vars.APPSAIL_UI_URL != '' }}
        env:
          UI: ${{ vars.APPSAIL_UI_URL }}
        run: |
          set -euo pipefail
          UI="${UI%/}"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 -A "ksp-appsail-keepalive/1.0" "${UI}/" || echo "000")
          echo "GET ${UI}/ → HTTP ${code}"
          test "$code" = "200"
