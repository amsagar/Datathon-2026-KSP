name: Build & Push Images (Docker Hub)

# Builds both linux/amd64 images and pushes them to Docker Hub, where the
# Catalyst console pulls them for AppSail deployment. GitHub-hosted runners are
# amd64, so no QEMU/emulation is needed.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  - your Docker ID
#   DOCKERHUB_TOKEN     - a Docker Hub Personal Access Token (Read/Write)

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

env:
  BE_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ksp-agent-be
  UI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ksp-agent-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BE_IMAGE }}:latest
            ${{ env.BE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push UI
        uses: docker/build-push-action@v6
        with:
          context: ./client
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.UI_IMAGE }}:latest
            ${{ env.UI_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Pushed images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${BE_IMAGE}:latest\` and \`${BE_IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${UI_IMAGE}:latest\` and \`${UI_IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy / redeploy them from the Catalyst console (see DEPLOY.md)." >> "$GITHUB_STEP_SUMMARY"
